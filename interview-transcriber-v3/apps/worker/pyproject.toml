[project]
name = "itr-worker"
version = "0.1.0"
description = "Dramatiq workers for the transcription pipeline"
requires-python = ">=3.12"
dependencies = [
  "dramatiq>=1.17",
  "dramatiq[redis]>=1.17",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "structlog>=24.4",
  "sentry-sdk>=2.18",
  "shared-py",
  "stt-service",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]
