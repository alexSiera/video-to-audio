[project]
name = "interview-transcriber-v3"
version = "0.1.0"
description = "SaaS для транскрибации длинных интервью. Монорепозиторий (Python workspace)."
readme = "README.md"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "apps/stt-service", "packages/shared-py"]

[tool.uv.sources]
shared-py = { workspace = true }
stt-service = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = ["E501"]  # длина строки — отдельная забота форматтера

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["docs/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
