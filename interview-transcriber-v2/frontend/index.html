<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whisper Transcriber</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 2rem; }
        h1 { text-align: center; margin-bottom: 1.5rem; color: #333; }
        .upload-area { border: 2px dashed #ccc; border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.2s; }
        .upload-area:hover { border-color: #666; background: #fafafa; }
        .upload-area.dragover { border-color: #4CAF50; background: #f0fff0; }
        input[type="file"] { display: none; }
        button { background: #4CAF50; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 1rem; }
        button:hover { background: #45a049; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 1rem; padding: 1rem; background: #f9f9f9; border-radius: 6px; display: none; }
        #progress { margin-top: 0.5rem; font-size: 0.9rem; color: #666; }
        #result { margin-top: 1rem; }
        #transcript { background: #f9f9f9; padding: 1rem; border-radius: 6px; min-height: 100px; max-height: 500px; overflow-y: auto; line-height: 1.8; font-size: 1rem; }
        #transcript:empty::before { content: ''; }
        .word { display: inline; opacity: 0; animation: fadeIn 0.15s ease forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        .skeleton-line { display: flex; gap: 6px; margin-top: 0.5rem; }
        .skeleton-word { height: 1em; background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 4px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .segments { margin-top: 1rem; }
        .segment { padding: 0.5rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .segment .time { color: #888; font-size: 0.8rem; }
        .word-timestamp { color: #999; font-size: 0.75rem; margin-right: 0.25rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Whisper Transcriber</h1>
        <div class="upload-area" id="dropZone">
            <p>Перетащите аудиофайл сюда или нажмите для выбора</p>
            <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.webm,.mp4">
        </div>
        <button id="uploadBtn" disabled>Транскрибировать</button>
        <div id="status"></div>
        <div id="progress"></div>
        <div id="result">
            <div id="transcript"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const progress = document.getElementById('progress');
        const transcript = document.getElementById('transcript');
        let selectedFile = null;

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                selectedFile = e.dataTransfer.files[0];
                updateUI();
            }
        });
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) {
                selectedFile = fileInput.files[0];
                updateUI();
            }
        });

        function updateUI() {
            if (selectedFile) {
                dropZone.innerHTML = `<p>${selectedFile.name}</p>`;
                uploadBtn.disabled = false;
            }
        }

        function showSkeleton() {
            const skeleton = document.createElement('div');
            skeleton.className = 'skeleton-line';
            skeleton.id = 'skeleton';
            for (let i = 0; i < 5; i++) {
                const w = document.createElement('div');
                w.className = 'skeleton-word';
                w.style.width = `${30 + Math.random() * 50}px`;
                skeleton.appendChild(w);
            }
            transcript.appendChild(skeleton);
            transcript.scrollTop = transcript.scrollHeight;
        }

        function removeSkeleton() {
            const s = document.getElementById('skeleton');
            if (s) s.remove();
        }

        function appendWords(words) {
            removeSkeleton();
            const frag = document.createDocumentFragment();
            for (const w of words) {
                const span = document.createElement('span');
                span.className = 'word';
                span.textContent = w.word + ' ';
                frag.appendChild(span);
            }
            transcript.appendChild(frag);
            transcript.scrollTop = transcript.scrollHeight;
        }

        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            uploadBtn.disabled = true;
            status.style.display = 'block';
            status.textContent = 'Загрузка файла...';
            progress.textContent = '';
            transcript.innerHTML = '';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const res = await fetch('/transcribe/stream', { method: 'POST', body: formData });
                if (!res.ok) {
                    const data = await res.json();
                    status.textContent = `Ошибка: ${data.detail || 'Неизвестная ошибка'}`;
                    uploadBtn.disabled = false;
                    return;
                }

                status.textContent = 'Транскрибация...';
                showSkeleton();

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const jsonStr = line.slice(6);
                        if (!jsonStr) continue;

                        try {
                            const data = JSON.parse(jsonStr);

                            if (data.error) {
                                removeSkeleton();
                                status.textContent = `Ошибка: ${data.error}`;
                                uploadBtn.disabled = false;
                                return;
                            }

                            if (data.type === 'done') {
                                removeSkeleton();
                                status.textContent = 'Готово!';
                                progress.textContent = '';
                                renderFinalResult(data.segments);
                                uploadBtn.disabled = false;
                                return;
                            }

                            if (data.type === 'chunk') {
                                progress.innerHTML = `Чанк <strong>${data.chunk}</strong> из <strong>${data.total}</strong>`;
                                if (data.words && data.words.length) {
                                    appendWords(data.words);
                                    showSkeleton();
                                }
                            }
                        } catch (e) {
                            // skip malformed JSON
                        }
                    }
                }
            } catch (e) {
                removeSkeleton();
                status.textContent = `Ошибка сети: ${e.message}`;
            }
            uploadBtn.disabled = false;
        });

        function renderFinalResult(segments) {
            transcript.innerHTML = '';
            if (!segments || !segments.length) return;
            const frag = document.createDocumentFragment();
            for (const seg of segments) {
                const div = document.createElement('div');
                div.className = 'segment';
                div.innerHTML = `<span class="word-timestamp">[${seg.start.toFixed(1)}s]</span> ${seg.text}`;
                frag.appendChild(div);
            }
            transcript.appendChild(frag);
        }
    </script>
</body>
</html>
